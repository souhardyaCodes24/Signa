<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signa — {% block title %}Threat Intelligence{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                         Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
            background: #f8f8f8;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .header-left h1 a { text-decoration: none; color: #111; }
        .header-left .sub { font-size: 12px; color: #777; margin-top: 1px; }

        .nav { display: flex; gap: 6px; }
        .nav a {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            color: #555;
            border-radius: 5px;
            transition: background 0.15s;
        }
        .nav a:hover { background: #eee; color: #222; }
        .nav a.active { background: #222; color: #fff; }

        .container {
            max-width: 780px;
            margin: 32px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px 28px;
        }
        .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 14px; }

        label {
            display: block; font-size: 13px; font-weight: 500;
            color: #555; margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%; padding: 9px 12px; font-size: 14px;
            font-family: "SF Mono", "Consolas", "Liberation Mono", monospace;
            border: 1px solid #ccc; border-radius: 6px; outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus { border-color: #888; }
        input[type="file"] { display: none; }

        .file-area {
            display: flex; align-items: center; gap: 10px; margin-top: 4px;
        }
        .file-label {
            display: inline-block; padding: 9px 18px; font-size: 14px; font-weight: 500;
            background: #222; color: #fff; border: none; border-radius: 6px;
            cursor: pointer; transition: background 0.15s; white-space: nowrap;
        }
        .file-label:hover { background: #444; }
        .file-name-text {
            font-size: 13px; color: #888; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
        }

        button {
            margin-top: 12px; padding: 9px 26px; font-size: 14px; font-weight: 500;
            background: #222; color: #fff; border: none; border-radius: 6px;
            cursor: pointer; transition: background 0.15s;
        }
        button:hover { background: #444; }
        button:active { background: #111; }
        button:disabled { background: #aaa; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 2px; }
        th, td {
            text-align: left; padding: 9px 10px;
            border-bottom: 1px solid #eee; font-size: 14px;
        }
        th { font-weight: 600; color: #555; width: 36%; white-space: nowrap; }
        td { font-family: "SF Mono", "Consolas", "Liberation Mono", monospace; word-break: break-all; }

        .tag {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 500;
        }
        .tag-malicious { background: #222; color: #fff; }
        .tag-clean     { background: #ddd; color: #333; }
        .tag-unknown   { background: #eee; color: #888; }

        .error-box {
            background: #f0f0f0; border: 1px solid #ccc; border-radius: 6px;
            padding: 14px 18px; font-size: 14px; color: #555;
        }

        .footer {
            text-align: center; font-size: 12px; color: #aaa;
            padding: 20px; border-top: 1px solid #eee; margin-top: auto;
        }
        .footer .credit { color: #888; margin-top: 4px; font-size: 11px; }

        .help-text { font-size: 12px; color: #999; margin-top: 5px; }

        /* ── Loading overlay ── */
        #loading {
            display: none;
            position: fixed; inset: 0; z-index: 999;
            background: rgba(248, 248, 248, 0.85);
            justify-content: center; align-items: center;
            flex-direction: column;
        }
        #loading.active { display: flex; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid #ddd;
            border-top-color: #222; border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { margin-top: 14px; font-size: 14px; color: #555; }

        .prop-grid {
            display: grid; grid-template-columns: auto 1fr; gap: 0;
            border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden;
            margin-bottom: 14px;
        }
        .prop-grid .prop-item {
            display: contents;
        }
        .prop-grid .prop-item > div {
            padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0;
        }
        .prop-grid .prop-item:last-child > div { border-bottom: none; }
        .prop-grid .prop-label {
            background: #fafafa; font-weight: 500; color: #555; white-space: nowrap;
        }
        .prop-grid .prop-val {
            font-family: "SF Mono", "Consolas", "Liberation Mono", monospace;
            color: #333; word-break: break-all;
        }

        .empty-state { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }

        /* ── Hero section ── */
        .hero { text-align: center; max-width: 600px; margin: 0 auto 32px auto; }
        .hero-heading { font-size: 26px; font-weight: 700; color: #111; margin: 0 0 10px 0; }
        .hero-sub { font-size: 14px; color: #666; line-height: 1.6; margin: 0; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <h1><a href="/">Signa</a></h1>
        <div class="sub">Privacy-preserving threat intelligence</div>
    </div>
    <div class="nav">
        <a href="/" class="{% block nav_home %}{% endblock %}">Scan</a>
        <a href="/history" class="{% block nav_history %}{% endblock %}">History</a>
    </div>
</div>

<div id="loading">
    <div class="spinner"></div>
    <p>Processing&hellip;</p>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<div class="footer">
    <div>Signa &mdash; hashes only, never your files.</div>
    <div class="credit">Built by Souhardya</div>
</div>

<script>
function showLoading() { document.getElementById('loading').classList.add('active'); }
</script>
</body>
</html>
